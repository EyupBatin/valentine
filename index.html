<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benimle Kahve İçmeye Gelir Misin? ✨</title>
  <style>
    :root {
      --bg-color: #ffe6ea;
      --card-bg: #ffffff;
      --primary: #ff4d6d;
      --primary-hover: #ff758f;
      --text-color: #590d22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px 25px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 35px rgba(255, 77, 109, 0.2);
      text-align: center;
      position: relative;
    }

    .gif-container {
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .gif-container img {
      max-height: 100%;
      max-width: 100%;
      border-radius: 16px;
      object-fit: contain;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #yesBtn {
      background: var(--primary);
      color: white;
      z-index: 10;
    }

    #yesBtn:hover {
      background: var(--primary-hover);
    }

    #noBtn {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
      position: relative;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Ana Soru Ekranı -->
    <div id="ask-container">
      <div class="gif-container">
        <!-- Yerel klasördeki resim yolu -->
        <img id="main-gif" src="images/main.gif" alt="Cute Bear">
      </div>
      <h1 id="question-text">Benimle tatlı bir kahve molasına çıkar mısın? ☕✨</h1>
      
      <div class="btn-group">
        <button id="yesBtn" onclick="acceptOffer()">Evet! 🥰</button>
        <button id="noBtn" onclick="handleNoClick()" onmouseover="handleNoHover()" ontouchstart="handleNoTouch(event)">Hayır 🙈</button>
      </div>
    </div>

    <!-- Kabul Edildi Ekranı -->
    <div id="success-container" class="hidden">
      <div class="gif-container">
        <!-- Kabul edildiğinde çıkacak yerel resim -->
        <img src="images/happy.gif" alt="Happy Dance">
      </div>
      <h1>Yaaa harika! Sözünü aldım 🎉</h1>
      <p style="margin-top: 10px; color: #590d22;">WhatsApp'a yönlendiriliyorsun...</p>
    </div>
  </div>

  <script>
    const MY_PHONE_NUMBER = "905000000000"; 

    // Yerel resim dizisi
    const noGifs = [
      "images/sad1.gif",
      "images/sad2.gif",
      "images/sad3.gif"
    ];

    const noTexts = [
      "Emin misin? 🥺",
      "Bir daha düşün bence! 💭",
      "Bak son kararın mı? 🙈",
      "Lütfen ama yaa... 👉👈",
      "Hayır butonu bozuldu galiba! 😅"
    ];

    let clickCount = 0;
    let yesScale = 1;

    function handleNoInteraction() {
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const mainGif = document.getElementById("main-gif");

      yesScale += 0.3;
      yesBtn.style.transform = `scale(${yesScale})`;

      const x = Math.floor(Math.random() * 180) - 90;
      const y = Math.floor(Math.random() * 140) - 70;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      if (clickCount < noGifs.length) {
        mainGif.src = noGifs[clickCount];
      }
      if (clickCount < noTexts.length) {
        noBtn.innerText = noTexts[clickCount];
      }

      clickCount++;
    }

    function handleNoClick() { handleNoInteraction(); }
    function handleNoHover() { handleNoInteraction(); }
    function handleNoTouch(e) {
      e.preventDefault();
      handleNoInteraction();
    }

    function acceptOffer() {
      document.getElementById("ask-container").classList.add("hidden");
      document.getElementById("success-container").classList.remove("hidden");

      const message = encodeURIComponent("Kahve teklifini kabul ediyorum! Ne zaman buluşuyoruz? ✨");
      
      setTimeout(() => {
        window.location.href = `https://wa.me/${MY_PHONE_NUMBER}?text=${message}`;
      }, 1800);
    }
  </script>
</body>
</html>
